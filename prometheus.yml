global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'kafka-broker'
    static_configs:
      - targets: ['kafka1:9404', 'kafka2:9404', 'kafka3:9404']
  - job_name: 'kafka-monitor'
    static_configs:
      - targets: ['host.docker.internal:8080']
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager:9093

rule_files:
  - /etc/prometheus/rules/broker-alerts.yml
  - /etc/prometheus/rules/alert.rules